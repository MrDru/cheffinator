<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheffinator Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-card: #141414;
      --bg-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #e5e5e5;
      --text-muted: #737373;
      --accent: #4ade80;
      --accent-hover: #22c55e;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --info: #3b82f6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 span { color: var(--accent); }

    .connection-form {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="text"], input[type="password"] {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      width: 400px;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .url-input-wrapper { position: relative; }

    .url-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 4px;
      display: none;
      z-index: 100;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .url-dropdown.show { display: block; }

    .url-dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }

    .url-dropdown-item:last-child { border-bottom: none; }
    .url-dropdown-item:hover { background: rgba(74, 222, 128, 0.1); }
    .url-dropdown-item.last-used { color: var(--accent); }

    .url-dropdown-item .url-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .url-dropdown-item .delete-url {
      color: var(--text-muted);
      padding: 4px 8px;
      margin-left: 8px;
      border-radius: 4px;
      opacity: 0.6;
      transition: all 0.2s;
    }

    .url-dropdown-item .delete-url:hover {
      opacity: 1;
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: #0a0a0a; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-hover); }
    .btn-info { background: var(--info); color: white; }
    .btn-info:hover { background: #2563eb; }
    .btn-small { padding: 6px 12px; font-size: 12px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.connected { background: var(--accent); }
    .status-dot.error { background: var(--danger); }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
      min-width: 120px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-value.warning { color: var(--warning); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-input { flex: 1; max-width: 300px; }

    .bulk-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 8px;
    }

    .bulk-actions span { font-size: 13px; color: var(--accent); }

    .filter-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(74, 222, 128, 0.15);
      border-radius: 20px;
      font-size: 13px;
      color: var(--accent);
    }

    .filter-tag .clear-filter {
      cursor: pointer;
      opacity: 0.7;
    }

    .filter-tag .clear-filter:hover { opacity: 1; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    th {
      text-align: left;
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      background: var(--bg-hover);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover { color: var(--text); }
    th.sorted { color: var(--accent); }
    th .sort-icon { margin-left: 4px; font-size: 10px; }

    td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-hover); }
    tr.selected td { background: rgba(74, 222, 128, 0.1); }

    .checkbox-cell { width: 40px; text-align: center; }
    input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }

    .editable {
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .editable:hover { background: rgba(74, 222, 128, 0.1); }
    .editable.editing { background: var(--bg-dark); }

    .editable input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      padding: 0;
    }

    .editable input:focus { outline: none; }

    .user-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(74, 222, 128, 0.15);
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s;
    }

    .user-badge:hover { background: rgba(74, 222, 128, 0.25); }

    .tag-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--info);
      margin: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-badge:hover { background: rgba(59, 130, 246, 0.25); }

    .tags-cell { max-width: 200px; }

    .recipe-image {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg-hover);
    }

    .no-image {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: var(--bg-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 20px;
    }

    .storage-image {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg-hover);
    }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal.wide { max-width: 800px; }

    .modal h2 { font-size: 20px; margin-bottom: 8px; }
    .modal p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; }

    .preview-section {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .preview-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .preview-section h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }

    .preview-banner {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .preview-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .preview-meta span { font-size: 13px; color: var(--text-muted); }

    .preview-ingredients, .preview-steps {
      list-style: none;
      font-size: 14px;
    }

    .preview-ingredients li, .preview-steps li {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .preview-ingredients li:last-child, .preview-steps li:last-child { border-bottom: none; }

    .preview-step-num {
      display: inline-block;
      width: 24px;
      height: 24px;
      background: var(--accent);
      color: var(--bg-dark);
      border-radius: 50%;
      text-align: center;
      line-height: 24px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 10px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1001;
      animation: slideIn 0.3s ease;
    }

    .toast.success { border-color: var(--accent); }
    .toast.error { border-color: var(--danger); }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .date { font-size: 13px; color: var(--text-muted); }
    .id-cell { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
      flex-wrap: wrap;
    }

    .tab {
      padding: 12px 24px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: -1px;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .add-form {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .add-form input { width: 250px; }

    .size-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .orphaned { color: var(--warning); }
    .used { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍳 <span>Cheffinator</span> Admin</h1>
      <div class="connection-form">
        <div class="url-input-wrapper">
          <input type="text" id="apiUrl" placeholder="Enter API URL (e.g., https://cheffinator.onrender.com)"
                 onfocus="showUrlDropdown()" autocomplete="off" />
          <div class="url-dropdown" id="urlDropdown"></div>
        </div>
        <input type="password" id="adminSecret" placeholder="Admin secret" autocomplete="off"
               style="max-width: 180px;" onkeydown="if(event.key==='Enter')connect()" />
        <button class="btn-primary" onclick="connect()">Connect</button>
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Not connected</span>
        </div>
      </div>
    </header>

    <div class="stats" id="stats" style="display: none;">
      <div class="stat-card">
        <div class="stat-value" id="totalRecipes">0</div>
        <div class="stat-label">Recipes</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalUsers">0</div>
        <div class="stat-label">Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalTags">0</div>
        <div class="stat-label">Tags</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="storageCount">0</div>
        <div class="stat-label">Images</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="storageSize">0</div>
        <div class="stat-label">Storage</div>
      </div>
      <div style="display: flex; gap: 12px; margin-left: auto; align-items: center;">
        <button class="btn-secondary" onclick="downloadBackup()">💾 Backup</button>
        <label class="btn-secondary" style="cursor: pointer; margin: 0;">
          📥 Import
          <input type="file" accept=".json" onchange="importBackup(event)" style="display: none;" />
        </label>
      </div>
    </div>

    <div class="tabs" id="tabs" style="display: none;">
      <button class="tab active" onclick="switchTab('recipes')">🍽️ Recipes</button>
      <button class="tab" onclick="switchTab('users')">👥 Users</button>
      <button class="tab" onclick="switchTab('tags')">🏷️ Tags</button>
      <button class="tab" onclick="switchTab('storage')">📦 Storage</button>
    </div>

    <!-- Recipes Tab -->
    <div class="tab-content active" id="recipesTab">
      <div class="toolbar" id="toolbar" style="display: none;">
        <input type="text" class="search-input" id="searchInput" placeholder="Search recipes..." oninput="filterRecipes()" />
        <div id="activeFilters"></div>
        <div id="bulkActions" style="display: none;">
          <div class="bulk-actions">
            <span><span id="selectedCount">0</span> selected</span>
            <button class="btn-danger btn-small" onclick="bulkDeleteRecipes()">Delete</button>
            <button class="btn-info btn-small" onclick="showBulkTransferModal()">Transfer</button>
            <button class="btn-secondary btn-small" onclick="clearSelection()">Clear</button>
          </div>
        </div>
        <button class="btn-secondary" onclick="loadRecipes()">↻ Refresh</button>
      </div>
      <div id="content">
        <div class="empty-state"><p>Enter your API URL above to connect</p></div>
      </div>
    </div>

    <!-- Users Tab -->
    <div class="tab-content" id="usersTab">
      <div class="add-form">
        <input type="text" id="newUserCode" placeholder="Chef name (3-20 chars)..." onkeydown="if(event.key==='Enter')addUser()" />
        <input type="text" id="newUserPassword" placeholder="Initial password (6+ chars)..." onkeydown="if(event.key==='Enter')addUser()" />
        <button class="btn-primary" onclick="addUser()">+ Add User</button>
        <button class="btn-secondary" onclick="loadUsers()">↻ Refresh</button>
      </div>
      <div id="usersContent">
        <div class="empty-state"><p>Connect to load users</p></div>
      </div>
    </div>

    <!-- Tags Tab -->
    <div class="tab-content" id="tagsTab">
      <div class="add-form">
        <input type="text" id="newTagName" placeholder="Enter new tag name..." onkeydown="if(event.key==='Enter')addTag()" />
        <button class="btn-primary" onclick="addTag()">+ Add Tag</button>
        <button class="btn-secondary" onclick="loadTags()">↻ Refresh</button>
      </div>
      <div id="tagsContent">
        <div class="empty-state"><p>Connect to load tags</p></div>
      </div>
    </div>

    <!-- Storage Tab -->
    <div class="tab-content" id="storageTab">
      <div class="toolbar">
        <div id="storageBulkActions" style="display: none;">
          <div class="bulk-actions">
            <span><span id="storageSelectedCount">0</span> selected</span>
            <button class="btn-danger btn-small" onclick="bulkDeleteFiles()">Delete</button>
            <button class="btn-secondary btn-small" onclick="clearStorageSelection()">Clear</button>
          </div>
        </div>
        <button class="btn-warning btn-small" onclick="deleteOrphanedFiles()" style="background: var(--warning); color: #000;">🗑️ Delete Orphaned</button>
        <button class="btn-secondary" onclick="loadStorage()">↻ Refresh</button>
      </div>
      <div id="storageContent">
        <div class="empty-state"><p>Connect to load storage</p></div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal" style="display: none;">
    <div class="modal">
      <h2 id="deleteModalTitle">⚠️ Delete</h2>
      <p id="deleteModalText"></p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Recipe Preview Modal -->
  <div class="modal-overlay" id="previewModal" style="display: none;">
    <div class="modal wide">
      <h2 id="previewTitle">Recipe Preview</h2>
      <div id="previewContent"></div>
      <div class="modal-actions" style="margin-top: 20px;">
        <button class="btn-secondary" onclick="closePreviewModal()">Close</button>
        <button class="btn-primary" onclick="openRecipeInApp()">Open in App</button>
      </div>
    </div>
  </div>

  <!-- Bulk Transfer Modal -->
  <div class="modal-overlay" id="transferModal" style="display: none;">
    <div class="modal">
      <h2>Transfer Recipes</h2>
      <p>Transfer <span id="transferCount">0</span> selected recipes to a new owner:</p>
      <input type="text" id="transferUserCode" placeholder="Enter user code..." style="width: 100%; margin-bottom: 16px;" />
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeTransferModal()">Cancel</button>
        <button class="btn-primary" onclick="confirmBulkTransfer()">Transfer</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" style="display: none;">
    <span id="toastMessage"></span>
  </div>

  <script>
    // Admin secret: entered in the connect bar, kept for the browser session,
    // sent on every request (the server requires x-admin-secret for /api/admin).
    let ADMIN_SECRET = sessionStorage.getItem('cheffinator_admin_secret') || '';
    const _origFetch = window.fetch.bind(window);
    window.fetch = (url, opts = {}) => {
      opts.headers = { ...(opts.headers || {}), 'x-admin-secret': ADMIN_SECRET };
      return _origFetch(url, opts);
    };

    let API_URL = '';
    let allRecipes = [];
    let allUsers = [];
    let allTags = [];
    let allFiles = [];
    let selectedRecipes = new Set();
    let selectedFiles = new Set();
    let deleteTarget = null;
    let previewRecipeId = null;
    let currentSort = { column: 'updated', dir: 'desc' };
    let activeUserFilter = null;
    let activeTagFilter = null;

    // URL History
    const URL_HISTORY_KEY = 'cheffinator_admin_urls';
    const LAST_URL_KEY = 'cheffinator_admin_last_url';

    function getSavedUrls() {
      try { return JSON.parse(localStorage.getItem(URL_HISTORY_KEY) || '[]'); } catch { return []; }
    }

    function saveUrl(url) {
      const urls = getSavedUrls().filter(u => u !== url);
      urls.unshift(url);
      localStorage.setItem(URL_HISTORY_KEY, JSON.stringify(urls.slice(0, 10)));
      localStorage.setItem(LAST_URL_KEY, url);
    }

    function deleteUrl(url, event) {
      event.stopPropagation();
      const urls = getSavedUrls().filter(u => u !== url);
      localStorage.setItem(URL_HISTORY_KEY, JSON.stringify(urls));
      if (localStorage.getItem(LAST_URL_KEY) === url) localStorage.setItem(LAST_URL_KEY, urls[0] || '');
      renderUrlDropdown();
    }

    function selectUrl(url) {
      document.getElementById('apiUrl').value = url;
      hideUrlDropdown();
    }

    function showUrlDropdown() {
      if (getSavedUrls().length > 0) {
        renderUrlDropdown();
        document.getElementById('urlDropdown').classList.add('show');
      }
    }

    function hideUrlDropdown() { document.getElementById('urlDropdown').classList.remove('show'); }

    function renderUrlDropdown() {
      const urls = getSavedUrls();
      const lastUrl = localStorage.getItem(LAST_URL_KEY);
      document.getElementById('urlDropdown').innerHTML = urls.map(url => `
        <div class="url-dropdown-item ${url === lastUrl ? 'last-used' : ''}" onclick="selectUrl('${url}')">
          <span class="url-text">${url === lastUrl ? '★ ' : ''}${url}</span>
          <span class="delete-url" onclick="deleteUrl('${url}', event)">✕</span>
        </div>
      `).join('');
    }

    document.addEventListener('click', e => {
      const wrapper = document.querySelector('.url-input-wrapper');
      if (wrapper && !wrapper.contains(e.target)) hideUrlDropdown();
    });

    document.addEventListener('DOMContentLoaded', () => {
      const lastUrl = localStorage.getItem(LAST_URL_KEY);
      if (lastUrl) document.getElementById('apiUrl').value = lastUrl;
      // Served from the API itself (/admin): prefill the URL with this origin
      if (!document.getElementById('apiUrl').value && window.location.origin.startsWith('http')) {
        document.getElementById('apiUrl').value = window.location.origin;
      }
      if (ADMIN_SECRET) document.getElementById('adminSecret').value = ADMIN_SECRET;
    });

    // Connect
    async function connect() {
      const url = document.getElementById('apiUrl').value.trim();
      if (!url) return showToast('Please enter an API URL', 'error');

      const secret = document.getElementById('adminSecret').value;
      if (secret) {
        ADMIN_SECRET = secret;
        sessionStorage.setItem('cheffinator_admin_secret', secret);
      }
      if (!ADMIN_SECRET) return showToast('Enter the admin secret', 'error');

      API_URL = url.replace(/\/$/, '');
      updateStatus('connecting');
      hideUrlDropdown();

      try {
        await Promise.all([loadRecipes(), loadUsers(), loadTags(), loadStorage()]);
        saveUrl(API_URL);
        updateStatus('connected');
        document.getElementById('stats').style.display = 'flex';
        document.getElementById('tabs').style.display = 'flex';
        document.getElementById('toolbar').style.display = 'flex';
        showToast('Connected!', 'success');
      } catch (error) {
        updateStatus('error');
        showToast('Failed to connect: ' + error.message, 'error');
      }
    }

    function updateStatus(status) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      dot.className = 'status-dot';
      if (status === 'connecting') text.textContent = 'Connecting...';
      else if (status === 'connected') { dot.classList.add('connected'); text.textContent = 'Connected'; }
      else if (status === 'error') { dot.classList.add('error'); text.textContent = 'Failed'; }
    }

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
    }

    // === RECIPES ===
    async function loadRecipes() {
      document.getElementById('content').innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Loading...</p></div>';
      try {
        const response = await fetch(`${API_URL}/api/admin/recipes`);
        if (!response.ok) throw new Error('Failed to fetch');
        allRecipes = await response.json();
        document.getElementById('totalRecipes').textContent = allRecipes.length;
        selectedRecipes.clear();
        updateBulkActions();
        renderRecipesTable();
      } catch (e) {
        document.getElementById('content').innerHTML = `<div class="empty-state"><p>Failed: ${e.message}</p></div>`;
        throw e;
      }
    }

    function renderRecipesTable() {
      const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
      let filtered = allRecipes.filter(r =>
        r.name.toLowerCase().includes(search) ||
        r.user_code.toLowerCase().includes(search) ||
        r.id.toLowerCase().includes(search) ||
        (r.tags || []).some(t => t.toLowerCase().includes(search))
      );

      if (activeUserFilter) filtered = filtered.filter(r => r.user_code.toLowerCase() === activeUserFilter.toLowerCase());
      if (activeTagFilter) filtered = filtered.filter(r => (r.tags || []).includes(activeTagFilter));

      // Sort
      filtered.sort((a, b) => {
        let aVal, bVal;
        switch (currentSort.column) {
          case 'name': aVal = a.name.toLowerCase(); bVal = b.name.toLowerCase(); break;
          case 'user': aVal = a.user_code.toLowerCase(); bVal = b.user_code.toLowerCase(); break;
          case 'updated': aVal = a.updated || ''; bVal = b.updated || ''; break;
          default: aVal = a.name; bVal = b.name;
        }
        if (aVal < bVal) return currentSort.dir === 'asc' ? -1 : 1;
        if (aVal > bVal) return currentSort.dir === 'asc' ? 1 : -1;
        return 0;
      });

      // Render filters
      let filtersHtml = '';
      if (activeUserFilter) filtersHtml += `<div class="filter-tag">User: ${activeUserFilter} <span class="clear-filter" onclick="clearUserFilter()">✕</span></div>`;
      if (activeTagFilter) filtersHtml += `<div class="filter-tag">Tag: ${activeTagFilter} <span class="clear-filter" onclick="clearTagFilter()">✕</span></div>`;
      document.getElementById('activeFilters').innerHTML = filtersHtml;

      if (filtered.length === 0) {
        document.getElementById('content').innerHTML = '<div class="empty-state"><p>No recipes found</p></div>';
        return;
      }

      const sortIcon = col => currentSort.column === col ? (currentSort.dir === 'asc' ? '▲' : '▼') : '';

      document.getElementById('content').innerHTML = `
        <table>
          <thead>
            <tr>
              <th class="checkbox-cell"><input type="checkbox" onchange="toggleAllRecipes(this)" /></th>
              <th style="width: 64px;">Image</th>
              <th style="width: 80px;">ID</th>
              <th class="${currentSort.column === 'name' ? 'sorted' : ''}" onclick="sortRecipes('name')">
                Name <span class="sort-icon">${sortIcon('name')}</span>
              </th>
              <th class="${currentSort.column === 'user' ? 'sorted' : ''}" onclick="sortRecipes('user')" style="width: 120px;">
                Owner <span class="sort-icon">${sortIcon('user')}</span>
              </th>
              <th style="width: 180px;">Tags</th>
              <th class="${currentSort.column === 'updated' ? 'sorted' : ''}" onclick="sortRecipes('updated')" style="width: 120px;">
                Updated <span class="sort-icon">${sortIcon('updated')}</span>
              </th>
              <th style="width: 160px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(r => `
              <tr data-id="${r.id}" class="${selectedRecipes.has(r.id) ? 'selected' : ''}">
                <td class="checkbox-cell"><input type="checkbox" ${selectedRecipes.has(r.id) ? 'checked' : ''} onchange="toggleRecipeSelect('${r.id}')" /></td>
                <td>${r.bannerImage ? `<img class="recipe-image" src="${r.bannerImage.startsWith('http') ? r.bannerImage : API_URL + r.bannerImage}" />` : '<div class="no-image">🍽️</div>'}</td>
                <td class="id-cell">${r.id.slice(0, 8)}...</td>
                <td><div class="editable" onclick="startEdit(this, '${r.id}', 'name')"><span>${escapeHtml(r.name)}</span></div></td>
                <td><span class="user-badge" onclick="filterByUser('${escapeHtml(r.user_code)}')">${escapeHtml(r.user_code)}</span></td>
                <td class="tags-cell">${(r.tags || []).slice(0, 3).map(t => `<span class="tag-badge" onclick="filterByTag('${escapeHtml(t)}')">${escapeHtml(t)}</span>`).join('')}${(r.tags || []).length > 3 ? `<span class="tag-badge">+${r.tags.length - 3}</span>` : ''}</td>
                <td class="date">${r.updated || 'Unknown'}</td>
                <td><div class="actions">
                  <button class="btn-secondary btn-small" onclick="previewRecipe('${r.id}')">👁️</button>
                  <button class="btn-danger btn-small" onclick="openDeleteModal('recipe', '${r.id}', '${escapeHtml(r.name)}')">🗑️</button>
                </div></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function sortRecipes(column) {
      if (currentSort.column === column) currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
      else { currentSort.column = column; currentSort.dir = 'asc'; }
      renderRecipesTable();
    }

    function filterByUser(user) { activeUserFilter = user; renderRecipesTable(); }
    function clearUserFilter() { activeUserFilter = null; renderRecipesTable(); }
    function filterByTag(tag) { activeTagFilter = tag; renderRecipesTable(); }
    function clearTagFilter() { activeTagFilter = null; renderRecipesTable(); }
    function filterRecipes() { renderRecipesTable(); }

    function toggleRecipeSelect(id) {
      if (selectedRecipes.has(id)) selectedRecipes.delete(id);
      else selectedRecipes.add(id);
      updateBulkActions();
      renderRecipesTable();
    }

    function toggleAllRecipes(checkbox) {
      const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
      let filtered = allRecipes.filter(r => r.name.toLowerCase().includes(search) || r.user_code.toLowerCase().includes(search));
      if (activeUserFilter) filtered = filtered.filter(r => r.user_code.toLowerCase() === activeUserFilter.toLowerCase());
      if (activeTagFilter) filtered = filtered.filter(r => (r.tags || []).includes(activeTagFilter));

      if (checkbox.checked) filtered.forEach(r => selectedRecipes.add(r.id));
      else selectedRecipes.clear();
      updateBulkActions();
      renderRecipesTable();
    }

    function clearSelection() { selectedRecipes.clear(); updateBulkActions(); renderRecipesTable(); }

    function updateBulkActions() {
      const count = selectedRecipes.size;
      document.getElementById('selectedCount').textContent = count;
      document.getElementById('bulkActions').style.display = count > 0 ? 'block' : 'none';
    }

    async function bulkDeleteRecipes() {
      if (selectedRecipes.size === 0) return;
      if (!confirm(`Delete ${selectedRecipes.size} recipes? This cannot be undone.`)) return;

      try {
        const response = await fetch(`${API_URL}/api/admin/recipes/bulk-delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids: [...selectedRecipes] })
        });
        if (!response.ok) throw new Error('Failed');
        const result = await response.json();
        showToast(`Deleted ${result.deleted} recipes`, 'success');
        await loadRecipes();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    function showBulkTransferModal() {
      document.getElementById('transferCount').textContent = selectedRecipes.size;
      document.getElementById('transferUserCode').value = '';
      document.getElementById('transferModal').style.display = 'flex';
    }

    function closeTransferModal() { document.getElementById('transferModal').style.display = 'none'; }

    async function confirmBulkTransfer() {
      const newUserCode = document.getElementById('transferUserCode').value.trim();
      if (!newUserCode) return showToast('Enter a user code', 'error');

      try {
        const response = await fetch(`${API_URL}/api/admin/recipes/bulk-transfer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids: [...selectedRecipes], newUserCode })
        });
        if (!response.ok) throw new Error('Failed');
        const result = await response.json();
        showToast(`Transferred ${result.transferred} recipes`, 'success');
        closeTransferModal();
        await loadRecipes();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    // Recipe Preview
    async function previewRecipe(id) {
      previewRecipeId = id;
      document.getElementById('previewContent').innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';
      document.getElementById('previewModal').style.display = 'flex';

      try {
        const response = await fetch(`${API_URL}/api/recipes/${id}`);
        if (!response.ok) throw new Error('Failed');
        const recipe = await response.json();
        const v = recipe.variations?.[0] || recipe;

        document.getElementById('previewTitle').textContent = recipe.name;
        document.getElementById('previewContent').innerHTML = `
          ${v.bannerImage ? `<img class="preview-banner" src="${v.bannerImage.startsWith('http') ? v.bannerImage : API_URL + v.bannerImage}" />` : ''}
          <div class="preview-meta">
            <span>👤 ${recipe.user_code || 'Unknown'}</span>
            <span>🍽️ ${v.servings || 4} servings</span>
            <span>📝 ${recipe.variations?.length || 1} variation(s)</span>
          </div>
          ${v.description ? `<p style="margin-bottom: 16px; color: var(--text-muted);">${escapeHtml(v.description)}</p>` : ''}
          ${v.tags?.length ? `<div style="margin-bottom: 16px;">${v.tags.map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          <div class="preview-section">
            <h3>Ingredients (${v.ingredients?.length || 0})</h3>
            <ul class="preview-ingredients">
              ${(v.ingredients || []).map(i => `<li>${i.amount ? i.amount + ' ' + i.unit + ' ' : ''}${escapeHtml(i.name)}</li>`).join('') || '<li>No ingredients</li>'}
            </ul>
          </div>
          <div class="preview-section">
            <h3>Steps (${v.stages?.length || 0})</h3>
            <ul class="preview-steps">
              ${(v.stages || []).map((s, i) => `<li><span class="preview-step-num">${i + 1}</span>${escapeHtml(s.text)}</li>`).join('') || '<li>No steps</li>'}
            </ul>
          </div>
        `;
      } catch (e) {
        document.getElementById('previewContent').innerHTML = `<p>Failed to load: ${e.message}</p>`;
      }
    }

    function closePreviewModal() { document.getElementById('previewModal').style.display = 'none'; }

    async function openRecipeInApp() {
      if (!previewRecipeId) return;
      try {
        const response = await fetch(`${API_URL}/api/admin/recipes/${previewRecipeId}/share`, { method: 'POST' });
        const data = await response.json();
        window.open(`${API_URL}/r/${data.shareId}`, '_blank');
      } catch { showToast('Could not open', 'error'); }
    }

    // Inline editing
    function startEdit(element, id, field) {
      if (element.classList.contains('editing')) return;
      const recipe = allRecipes.find(r => r.id === id);
      const value = recipe[field];
      element.classList.add('editing');
      element.innerHTML = `<input type="text" value="${escapeHtml(value)}" onblur="finishEdit(this, '${id}', '${field}')" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${escapeHtml(value)}';this.blur();}" />`;
      element.querySelector('input').focus();
      element.querySelector('input').select();
    }

    async function finishEdit(input, id, field) {
      const newValue = input.value.trim();
      const recipe = allRecipes.find(r => r.id === id);
      const oldValue = recipe[field];
      const parent = input.parentElement;
      parent.classList.remove('editing');

      if (newValue === oldValue || !newValue) {
        parent.innerHTML = `<span>${escapeHtml(oldValue)}</span>`;
        return;
      }

      parent.innerHTML = '<span style="color: var(--text-muted);">Saving...</span>';

      try {
        const response = field === 'user_code'
          ? await fetch(`${API_URL}/api/admin/recipes/bulk-transfer`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ids: [id], newUserCode: newValue })
            })
          : await fetch(`${API_URL}/api/admin/recipes/${id}/rename`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: newValue })
            });
        if (!response.ok) throw new Error('Failed');
        recipe[field] = newValue;
        showToast('Updated!', 'success');
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
      renderRecipesTable();
    }

    // === USERS ===
    async function loadUsers() {
      document.getElementById('usersContent').innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';
      try {
        const response = await fetch(`${API_URL}/api/admin/users`);
        if (!response.ok) throw new Error('Failed');
        allUsers = await response.json();
        document.getElementById('totalUsers').textContent = allUsers.length;
        renderUsersTable();
      } catch (e) {
        document.getElementById('usersContent').innerHTML = `<div class="empty-state"><p>Failed: ${e.message}</p></div>`;
      }
    }

    function renderUsersTable() {
      if (allUsers.length === 0) {
        document.getElementById('usersContent').innerHTML = '<div class="empty-state"><p>No users</p></div>';
        return;
      }
      document.getElementById('usersContent').innerHTML = `
        <table>
          <thead><tr>
            <th>Chef name</th>
            <th style="width: 110px;">Sign-in</th>
            <th>Google account</th>
            <th style="width: 80px;">Recipes</th>
            <th style="width: 120px;">Created</th>
            <th style="width: 150px;">Actions</th>
          </tr></thead>
          <tbody>
            ${allUsers.map(u => `
              <tr>
                <td>
                  <div style="display:flex; align-items:center; gap:8px;">
                    ${u.avatarUrl ? `<img src="${escapeHtml(u.avatarUrl)}" referrerpolicy="no-referrer" style="width:24px;height:24px;border-radius:50%;" />` : ''}
                    <div class="editable" onclick="startEditUser(this, '${escapeHtml(u.code)}')"><span class="user-badge">${escapeHtml(u.code)}</span></div>
                  </div>
                </td>
                <td>
                  ${u.hasGoogle ? '<span class="user-badge" title="Signs in with Google">G</span>' : ''}
                  ${u.hasPassword ? '<span class="user-badge" title="Has a password">🔑</span>' : ''}
                  ${!u.hasGoogle && !u.hasPassword ? '<span style="color: var(--accent-red);" title="No way to log in!">none</span>' : ''}
                </td>
                <td class="date">${escapeHtml(u.displayName || '')}${u.email ? ` · ${escapeHtml(u.email)}` : ''}</td>
                <td>${u.recipeCount}</td>
                <td class="date">${new Date(u.createdAt).toLocaleDateString()}</td>
                <td>
                  <button class="btn-secondary btn-small" title="Set / reset password" onclick="resetPassword('${escapeHtml(u.code)}')">🔑</button>
                  <button class="btn-secondary btn-small" title="Sign out everywhere" onclick="revokeSessions('${escapeHtml(u.code)}')">⏻</button>
                  <button class="btn-danger btn-small" title="Delete user" onclick="openDeleteModal('user', '${escapeHtml(u.code)}', '${escapeHtml(u.code)}')">🗑️</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function addUser() {
      const code = document.getElementById('newUserCode').value.trim();
      const password = document.getElementById('newUserPassword').value;
      if (!code) return showToast('Enter a chef name', 'error');
      if (!password || password.length < 6) return showToast('Password must be 6+ characters', 'error');

      try {
        const response = await fetch(`${API_URL}/api/admin/users`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, password })
        });
        if (response.status === 409) return showToast('User exists', 'error');
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || 'Failed');
        }
        document.getElementById('newUserCode').value = '';
        document.getElementById('newUserPassword').value = '';
        showToast('User created!', 'success');
        await loadUsers();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function resetPassword(code) {
      const password = prompt(`New password for "${code}" (6+ characters):`);
      if (password === null) return;
      if (password.length < 6) return showToast('Password must be 6+ characters', 'error');
      try {
        const response = await fetch(`${API_URL}/api/admin/users/${encodeURIComponent(code)}/password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || 'Failed');
        }
        showToast(`Password set for ${code}`, 'success');
        await loadUsers();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function revokeSessions(code) {
      if (!confirm(`Sign "${code}" out of all devices?`)) return;
      try {
        const response = await fetch(`${API_URL}/api/admin/users/${encodeURIComponent(code)}/logout`, { method: 'POST' });
        if (!response.ok) throw new Error('Failed');
        const data = await response.json();
        showToast(`${code}: ${data.sessionsRevoked} session(s) revoked`, 'success');
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    function startEditUser(element, code) {
      if (element.classList.contains('editing')) return;
      element.classList.add('editing');
      element.innerHTML = `<input type="text" value="${escapeHtml(code)}" onblur="finishEditUser(this, '${escapeHtml(code)}')" onkeydown="if(event.key==='Enter')this.blur();" />`;
      element.querySelector('input').focus();
      element.querySelector('input').select();
    }

    async function finishEditUser(input, oldCode) {
      const newCode = input.value.trim();
      const parent = input.parentElement;
      parent.classList.remove('editing');

      if (newCode === oldCode || !newCode) {
        parent.innerHTML = `<span class="user-badge">${escapeHtml(oldCode)}</span>`;
        return;
      }

      parent.innerHTML = '<span style="color: var(--text-muted);">Saving...</span>';

      try {
        const response = await fetch(`${API_URL}/api/admin/users/${encodeURIComponent(oldCode)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newCode })
        });
        if (response.status === 409) { showToast('User exists', 'error'); parent.innerHTML = `<span class="user-badge">${escapeHtml(oldCode)}</span>`; return; }
        if (!response.ok) throw new Error('Failed');
        showToast('Renamed!', 'success');
        await loadUsers();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
        parent.innerHTML = `<span class="user-badge">${escapeHtml(oldCode)}</span>`;
      }
    }

    // === TAGS ===
    async function loadTags() {
      document.getElementById('tagsContent').innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';
      try {
        const response = await fetch(`${API_URL}/api/admin/tags`);
        if (!response.ok) throw new Error('Failed');
        allTags = await response.json();
        document.getElementById('totalTags').textContent = allTags.length;
        renderTagsTable();
      } catch (e) {
        document.getElementById('tagsContent').innerHTML = `<div class="empty-state"><p>Failed: ${e.message}</p></div>`;
      }
    }

    function renderTagsTable() {
      if (allTags.length === 0) {
        document.getElementById('tagsContent').innerHTML = '<div class="empty-state"><p>No custom tags</p></div>';
        return;
      }
      document.getElementById('tagsContent').innerHTML = `
        <table>
          <thead><tr><th>Tag Name</th><th style="width: 140px;">Created</th><th style="width: 100px;">Actions</th></tr></thead>
          <tbody>
            ${allTags.map(t => `
              <tr>
                <td><div class="editable" onclick="startEditTag(this, ${t.id}, '${escapeHtml(t.name)}')"><span class="tag-badge" style="font-size: 14px;">${escapeHtml(t.name)}</span></div></td>
                <td class="date">${new Date(t.created_at).toLocaleDateString()}</td>
                <td><button class="btn-danger btn-small" onclick="openDeleteModal('tag', ${t.id}, '${escapeHtml(t.name)}')">🗑️</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function addTag() {
      const name = document.getElementById('newTagName').value.trim();
      if (!name) return showToast('Enter a tag name', 'error');

      try {
        const response = await fetch(`${API_URL}/api/admin/tags`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (response.status === 409) return showToast('Tag exists', 'error');
        if (!response.ok) throw new Error('Failed');
        document.getElementById('newTagName').value = '';
        showToast('Tag created!', 'success');
        await loadTags();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    function startEditTag(element, id, name) {
      if (element.classList.contains('editing')) return;
      element.classList.add('editing');
      element.innerHTML = `<input type="text" value="${escapeHtml(name)}" onblur="finishEditTag(this, ${id}, '${escapeHtml(name)}')" onkeydown="if(event.key==='Enter')this.blur();" />`;
      element.querySelector('input').focus();
      element.querySelector('input').select();
    }

    async function finishEditTag(input, id, oldName) {
      const newName = input.value.trim();
      const parent = input.parentElement;
      parent.classList.remove('editing');

      if (newName === oldName || !newName) {
        parent.innerHTML = `<span class="tag-badge" style="font-size: 14px;">${escapeHtml(oldName)}</span>`;
        return;
      }

      parent.innerHTML = '<span style="color: var(--text-muted);">Saving...</span>';

      try {
        const response = await fetch(`${API_URL}/api/admin/tags/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName })
        });
        if (response.status === 409) { showToast('Tag exists', 'error'); parent.innerHTML = `<span class="tag-badge" style="font-size: 14px;">${escapeHtml(oldName)}</span>`; return; }
        if (!response.ok) throw new Error('Failed');
        showToast('Renamed!', 'success');
        await loadTags();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
        parent.innerHTML = `<span class="tag-badge" style="font-size: 14px;">${escapeHtml(oldName)}</span>`;
      }
    }

    // === STORAGE ===
    async function loadStorage() {
      document.getElementById('storageContent').innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';
      try {
        const response = await fetch(`${API_URL}/api/admin/storage`);
        if (!response.ok) throw new Error('Failed');
        const data = await response.json();
        allFiles = data.files || [];
        document.getElementById('storageCount').textContent = data.totalFiles;
        document.getElementById('storageSize').textContent = formatSize(data.totalSize);
        selectedFiles.clear();
        updateStorageBulkActions();
        renderStorageTable(data);
      } catch (e) {
        document.getElementById('storageContent').innerHTML = `<div class="empty-state"><p>Failed: ${e.message}</p></div>`;
      }
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function renderStorageTable(data) {
      if (allFiles.length === 0) {
        document.getElementById('storageContent').innerHTML = '<div class="empty-state"><p>No files in storage</p></div>';
        return;
      }

      document.getElementById('storageContent').innerHTML = `
        <div style="margin-bottom: 16px; padding: 12px; background: var(--bg-card); border-radius: 8px; display: flex; gap: 24px;">
          <span>Total: <strong>${data.totalFiles}</strong> files (${formatSize(data.totalSize)})</span>
          <span class="orphaned">Orphaned: <strong>${data.orphanedCount}</strong> files (${formatSize(data.orphanedSize)})</span>
        </div>
        <table>
          <thead><tr>
            <th class="checkbox-cell"><input type="checkbox" onchange="toggleAllFiles(this)" /></th>
            <th style="width: 80px;">Preview</th>
            <th>Filename</th>
            <th style="width: 100px;">Size</th>
            <th style="width: 100px;">Status</th>
            <th style="width: 100px;">Actions</th>
          </tr></thead>
          <tbody>
            ${allFiles.map(f => `
              <tr class="${selectedFiles.has(f.name) ? 'selected' : ''}">
                <td class="checkbox-cell"><input type="checkbox" ${selectedFiles.has(f.name) ? 'checked' : ''} onchange="toggleFileSelect('${f.name}')" /></td>
                <td><img class="storage-image" src="${f.url}" onerror="this.style.display='none'" /></td>
                <td class="id-cell">${f.name}</td>
                <td class="size-display">${formatSize(f.size)}</td>
                <td><span class="${f.isUsed ? 'used' : 'orphaned'}">${f.isUsed ? '✓ Used' : '⚠ Orphaned'}</span></td>
                <td><button class="btn-danger btn-small" onclick="openDeleteModal('file', '${f.name}', '${f.name}')">🗑️</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function toggleFileSelect(name) {
      if (selectedFiles.has(name)) selectedFiles.delete(name);
      else selectedFiles.add(name);
      updateStorageBulkActions();
      loadStorage();
    }

    function toggleAllFiles(checkbox) {
      if (checkbox.checked) allFiles.forEach(f => selectedFiles.add(f.name));
      else selectedFiles.clear();
      updateStorageBulkActions();
      loadStorage();
    }

    function clearStorageSelection() { selectedFiles.clear(); updateStorageBulkActions(); loadStorage(); }

    function updateStorageBulkActions() {
      const count = selectedFiles.size;
      document.getElementById('storageSelectedCount').textContent = count;
      document.getElementById('storageBulkActions').style.display = count > 0 ? 'block' : 'none';
    }

    async function bulkDeleteFiles() {
      if (selectedFiles.size === 0) return;
      if (!confirm(`Delete ${selectedFiles.size} files?`)) return;

      try {
        const response = await fetch(`${API_URL}/api/admin/storage/bulk-delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filenames: [...selectedFiles] })
        });
        if (!response.ok) throw new Error('Failed');
        showToast(`Deleted ${selectedFiles.size} files`, 'success');
        await loadStorage();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function deleteOrphanedFiles() {
      const orphaned = allFiles.filter(f => !f.isUsed);
      if (orphaned.length === 0) return showToast('No orphaned files', 'success');
      if (!confirm(`Delete ${orphaned.length} orphaned files?`)) return;

      try {
        const response = await fetch(`${API_URL}/api/admin/storage/bulk-delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filenames: orphaned.map(f => f.name) })
        });
        if (!response.ok) throw new Error('Failed');
        showToast(`Deleted ${orphaned.length} orphaned files`, 'success');
        await loadStorage();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    // === DELETE MODAL ===
    function openDeleteModal(type, id, name) {
      deleteTarget = { type, id, name };
      document.getElementById('deleteModalTitle').textContent = `⚠️ Delete ${type.charAt(0).toUpperCase() + type.slice(1)}`;
      document.getElementById('deleteModalText').innerHTML = `Are you sure you want to delete "${escapeHtml(name)}"?`;
      document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeDeleteModal() { document.getElementById('deleteModal').style.display = 'none'; deleteTarget = null; }

    async function confirmDelete() {
      if (!deleteTarget) return;
      const { type, id, name } = deleteTarget;

      try {
        let url, method = 'DELETE';
        if (type === 'recipe') url = `${API_URL}/api/recipes/${id}`;
        else if (type === 'user') url = `${API_URL}/api/admin/users/${encodeURIComponent(id)}`;
        else if (type === 'tag') url = `${API_URL}/api/admin/tags/${id}`;
        else if (type === 'file') url = `${API_URL}/api/admin/storage/${encodeURIComponent(id)}`;

        const response = await fetch(url, { method });
        if (!response.ok) throw new Error('Failed');
        showToast(`Deleted ${name}`, 'success');

        if (type === 'recipe') await loadRecipes();
        else if (type === 'user') await loadUsers();
        else if (type === 'tag') await loadTags();
        else if (type === 'file') await loadStorage();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
      closeDeleteModal();
    }

    // === BACKUP/IMPORT ===
    async function downloadBackup() {
      if (!API_URL) return showToast('Connect first', 'error');
      try {
        const response = await fetch(`${API_URL}/api/admin/backup`);
        if (!response.ok) throw new Error('Failed');
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cheffinator-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        window.URL.revokeObjectURL(url);
        showToast('Backup downloaded!', 'success');
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }

    async function importBackup(event) {
      if (!API_URL) return showToast('Connect first', 'error');
      const file = event.target.files[0];
      if (!file) return;
      const clearExisting = confirm('OK = REPLACE all data\nCancel = MERGE with existing');

      try {
        const text = await file.text();
        const backup = JSON.parse(text);
        if (!backup.data) throw new Error('Invalid format');

        const response = await fetch(`${API_URL}/api/admin/import`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: backup.data, clearExisting })
        });
        if (!response.ok) throw new Error('Failed');
        const result = await response.json();
        showToast(`Imported ${result.imported.recipes} recipes, ${result.imported.users} users`, 'success');
        await Promise.all([loadRecipes(), loadUsers(), loadTags()]);
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
      event.target.value = '';
    }

    // === UTILS ===
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.className = 'toast ' + type;
      document.getElementById('toastMessage').textContent = message;
      toast.style.display = 'flex';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
  </script>
</body>
</html>
