<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheffinator Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --bg-card: #141414;
      --bg-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #e5e5e5;
      --text-muted: #737373;
      --accent: #4ade80;
      --accent-hover: #22c55e;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 span {
      color: var(--accent);
    }

    .connection-form {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    input[type="text"], input[type="password"] {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      width: 400px;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .url-input-wrapper {
      position: relative;
    }

    .url-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 4px;
      display: none;
      z-index: 100;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .url-dropdown.show {
      display: block;
    }

    .url-dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }

    .url-dropdown-item:last-child {
      border-bottom: none;
    }

    .url-dropdown-item:hover {
      background: rgba(229, 192, 123, 0.1);
    }

    .url-dropdown-item.last-used {
      color: var(--accent);
    }

    .url-dropdown-item .url-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .url-dropdown-item .delete-url {
      color: var(--text-muted);
      padding: 4px 8px;
      margin-left: 8px;
      border-radius: 4px;
      opacity: 0.6;
      transition: all 0.2s;
    }

    .url-dropdown-item .delete-url:hover {
      opacity: 1;
      color: #e06c75;
      background: rgba(224, 108, 117, 0.1);
    }

    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0a0a;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.connected {
      background: var(--accent);
    }

    .status-dot.error {
      background: var(--danger);
    }

    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 28px;
      min-width: 150px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      max-width: 300px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    th {
      text-align: left;
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      background: var(--bg-hover);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: var(--bg-hover);
    }

    .editable {
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .editable:hover {
      background: rgba(74, 222, 128, 0.1);
    }

    .editable.editing {
      background: var(--bg-dark);
    }

    .editable input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      padding: 0;
    }

    .editable input:focus {
      outline: none;
    }

    .user-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(74, 222, 128, 0.15);
      color: var(--accent);
    }

    .recipe-image {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg-hover);
    }

    .no-image {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: var(--bg-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 20px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      max-width: 500px;
      width: 90%;
    }

    .modal h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .modal p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1001;
      animation: slideIn 0.3s ease;
    }

    .toast.success {
      border-color: var(--accent);
    }

    .toast.error {
      border-color: var(--danger);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .date {
      font-size: 13px;
      color: var(--text-muted);
    }

    .id-cell {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .tab {
      padding: 12px 24px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: -1px;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .add-user-form {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .add-user-form input {
      width: 250px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍳 <span>Cheffinator</span> Admin</h1>
      <div class="connection-form">
        <div class="url-input-wrapper">
          <input type="text" id="apiUrl" placeholder="Enter API URL (e.g., https://cheffinator.onrender.com)" 
                 onfocus="showUrlDropdown()" autocomplete="off" />
          <div class="url-dropdown" id="urlDropdown"></div>
        </div>
        <button class="btn-primary" onclick="connect()">Connect</button>
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Not connected</span>
        </div>
      </div>
    </header>

    <div class="stats" id="stats" style="display: none;">
      <div class="stat-card">
        <div class="stat-value" id="totalRecipes">0</div>
        <div class="stat-label">Total Recipes</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalUsers">0</div>
        <div class="stat-label">Users</div>
      </div>
      <div style="display: flex; gap: 12px; margin-left: auto; align-items: center;">
        <button class="btn-secondary" onclick="downloadBackup()" style="display: flex; align-items: center; gap: 6px;">
          💾 Backup
        </button>
        <label class="btn-secondary" style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0;">
          📥 Import
          <input type="file" accept=".json" onchange="importBackup(event)" style="display: none;" />
        </label>
      </div>
    </div>

    <div class="tabs" id="tabs" style="display: none;">
      <button class="tab active" onclick="switchTab('recipes')">🍽️ Recipes</button>
      <button class="tab" onclick="switchTab('users')">👥 Users</button>
    </div>

    <!-- Recipes Tab -->
    <div class="tab-content active" id="recipesTab">
      <div class="toolbar" id="toolbar" style="display: none;">
        <input type="text" class="search-input" id="searchInput" placeholder="Search recipes..." oninput="filterRecipes()" />
        <button class="btn-secondary" onclick="loadRecipes()">↻ Refresh</button>
      </div>

      <div id="content">
        <div class="empty-state">
          <p>Enter your API URL above to connect</p>
        </div>
      </div>
    </div>

    <!-- Users Tab -->
    <div class="tab-content" id="usersTab">
      <div class="add-user-form">
        <input type="text" id="newUserCode" placeholder="Enter new user code..." onkeydown="if(event.key==='Enter')addUser()" />
        <button class="btn-primary" onclick="addUser()">+ Add User</button>
        <button class="btn-secondary" onclick="loadUsers()">↻ Refresh</button>
      </div>

      <div id="usersContent">
        <div class="empty-state">
          <p>Connect to load users</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal" style="display: none;">
    <div class="modal">
      <h2>⚠️ Delete Recipe</h2>
      <p>Are you sure you want to delete "<span id="deleteRecipeName"></span>"? This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" style="display: none;">
    <span id="toastMessage"></span>
  </div>

  <script>
    let API_URL = '';
    let allRecipes = [];
    let allUsers = [];
    let deleteTargetId = null;
    let deleteTargetType = null; // 'recipe' or 'user'

    // URL History Management
    const URL_HISTORY_KEY = 'cheffinator_admin_urls';
    const LAST_URL_KEY = 'cheffinator_admin_last_url';

    function getSavedUrls() {
      try {
        return JSON.parse(localStorage.getItem(URL_HISTORY_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveUrl(url) {
      const urls = getSavedUrls();
      // Remove if exists (to avoid duplicates)
      const filtered = urls.filter(u => u !== url);
      // Add to front
      filtered.unshift(url);
      // Keep max 10
      const limited = filtered.slice(0, 10);
      localStorage.setItem(URL_HISTORY_KEY, JSON.stringify(limited));
      localStorage.setItem(LAST_URL_KEY, url);
    }

    function deleteUrl(url, event) {
      event.stopPropagation();
      const urls = getSavedUrls().filter(u => u !== url);
      localStorage.setItem(URL_HISTORY_KEY, JSON.stringify(urls));
      // If deleted the last used URL, clear it
      if (localStorage.getItem(LAST_URL_KEY) === url) {
        localStorage.setItem(LAST_URL_KEY, urls[0] || '');
      }
      renderUrlDropdown();
    }

    function selectUrl(url) {
      document.getElementById('apiUrl').value = url;
      hideUrlDropdown();
    }

    function showUrlDropdown() {
      const urls = getSavedUrls();
      if (urls.length > 0) {
        renderUrlDropdown();
        document.getElementById('urlDropdown').classList.add('show');
      }
    }

    function hideUrlDropdown() {
      document.getElementById('urlDropdown').classList.remove('show');
    }

    function renderUrlDropdown() {
      const urls = getSavedUrls();
      const lastUrl = localStorage.getItem(LAST_URL_KEY);
      const dropdown = document.getElementById('urlDropdown');
      
      if (urls.length === 0) {
        dropdown.innerHTML = '';
        return;
      }

      dropdown.innerHTML = urls.map(url => `
        <div class="url-dropdown-item ${url === lastUrl ? 'last-used' : ''}" onclick="selectUrl('${url}')">
          <span class="url-text">${url === lastUrl ? '★ ' : ''}${url}</span>
          <span class="delete-url" onclick="deleteUrl('${url}', event)">✕</span>
        </div>
      `).join('');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      const wrapper = document.querySelector('.url-input-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        hideUrlDropdown();
      }
    });

    // Load last URL on page load
    document.addEventListener('DOMContentLoaded', function() {
      const lastUrl = localStorage.getItem(LAST_URL_KEY);
      if (lastUrl) {
        document.getElementById('apiUrl').value = lastUrl;
      }
    });

    // Connect to API
    async function connect() {
      const url = document.getElementById('apiUrl').value.trim();
      if (!url) {
        showToast('Please enter an API URL', 'error');
        return;
      }

      API_URL = url.replace(/\/$/, ''); // Remove trailing slash
      
      updateStatus('connecting');
      hideUrlDropdown();
      
      try {
        await Promise.all([loadRecipes(), loadUsers()]);
        // Save URL on successful connection
        saveUrl(API_URL);
        updateStatus('connected');
        document.getElementById('stats').style.display = 'flex';
        document.getElementById('tabs').style.display = 'flex';
        document.getElementById('toolbar').style.display = 'flex';
        showToast('Connected successfully!', 'success');
      } catch (error) {
        updateStatus('error');
        showToast('Failed to connect: ' + error.message, 'error');
      }
    }

    // Download database backup
    async function downloadBackup() {
      if (!API_URL) {
        showToast('Please connect to the API first', 'error');
        return;
      }
      
      try {
        showToast('Creating backup...', 'success');
        const response = await fetch(`${API_URL}/api/admin/backup`);
        if (!response.ok) throw new Error('Failed to create backup');
        
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cheffinator-backup-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        
        showToast('Backup downloaded successfully!', 'success');
      } catch (error) {
        showToast('Failed to create backup: ' + error.message, 'error');
      }
    }

    // Import database from backup file
    async function importBackup(event) {
      if (!API_URL) {
        showToast('Please connect to the API first', 'error');
        return;
      }
      
      const file = event.target.files[0];
      if (!file) return;
      
      // Confirm before import
      const clearExisting = confirm(
        '⚠️ Import Options:\n\n' +
        'Click OK to REPLACE all existing data with the backup.\n' +
        'Click Cancel to MERGE backup with existing data (may cause duplicates).'
      );
      
      try {
        showToast('Reading backup file...', 'success');
        const text = await file.text();
        const backup = JSON.parse(text);
        
        if (!backup.data) {
          throw new Error('Invalid backup file format');
        }
        
        showToast('Importing data...', 'success');
        const response = await fetch(`${API_URL}/api/admin/import`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: backup.data, clearExisting })
        });
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Import failed');
        }
        
        const result = await response.json();
        showToast(
          `Import complete! ${result.imported.recipes} recipes, ${result.imported.users} users imported.`, 
          'success'
        );
        
        // Refresh the data
        await Promise.all([loadRecipes(), loadUsers()]);
        
      } catch (error) {
        showToast('Failed to import: ' + error.message, 'error');
      }
      
      // Reset file input
      event.target.value = '';
    }

    // Tab switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
    }

    // Update connection status
    function updateStatus(status) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      
      dot.className = 'status-dot';
      
      switch (status) {
        case 'connecting':
          text.textContent = 'Connecting...';
          break;
        case 'connected':
          dot.classList.add('connected');
          text.textContent = 'Connected';
          break;
        case 'error':
          dot.classList.add('error');
          text.textContent = 'Connection failed';
          break;
      }
    }

    // Load all recipes
    async function loadRecipes() {
      document.getElementById('content').innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Loading recipes...</p>
        </div>
      `;

      try {
        // Fetch ALL recipes from admin endpoint
        const response = await fetch(`${API_URL}/api/admin/recipes`);
        if (!response.ok) throw new Error('Failed to fetch recipes');
        
        allRecipes = await response.json();
        
        // Update stats
        document.getElementById('totalRecipes').textContent = allRecipes.length;
        const uniqueUsers = [...new Set(allRecipes.map(r => r.user_code))];
        document.getElementById('totalUsers').textContent = uniqueUsers.length;

        renderTable();
      } catch (e) {
        console.error('Failed to fetch recipes:', e);
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <p>Failed to load recipes: ${e.message}</p>
          </div>
        `;
        throw e;
      }
    }

    // Render the table
    function renderTable() {
      const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
      
      const filtered = allRecipes.filter(r => 
        r.name.toLowerCase().includes(searchTerm) ||
        r.user_code.toLowerCase().includes(searchTerm) ||
        r.id.toLowerCase().includes(searchTerm)
      );

      if (filtered.length === 0) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <p>No recipes found</p>
          </div>
        `;
        return;
      }

      const rows = filtered.map(r => `
        <tr data-id="${r.id}">
          <td>
            ${r.bannerImage 
              ? `<img class="recipe-image" src="${r.bannerImage.startsWith('http') ? r.bannerImage : API_URL + r.bannerImage}" alt="" />`
              : `<div class="no-image">🍽️</div>`
            }
          </td>
          <td class="id-cell">${r.id.slice(0, 8)}...</td>
          <td>
            <div class="editable" onclick="startEdit(this, '${r.id}', 'name')">
              <span>${escapeHtml(r.name)}</span>
            </div>
          </td>
          <td>
            <div class="editable" onclick="startEdit(this, '${r.id}', 'user_code')">
              <span class="user-badge">${escapeHtml(r.user_code)}</span>
            </div>
          </td>
          <td class="date">${r.updated || 'Unknown'}</td>
          <td>
            <div class="actions">
              <button class="btn-secondary btn-small" onclick="viewRecipe('${r.id}')">View</button>
              <button class="btn-danger btn-small" onclick="openDeleteModal('${r.id}', '${escapeHtml(r.name)}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      document.getElementById('content').innerHTML = `
        <table>
          <thead>
            <tr>
              <th style="width: 64px;">Image</th>
              <th style="width: 100px;">ID</th>
              <th>Name</th>
              <th style="width: 140px;">Owner</th>
              <th style="width: 140px;">Updated</th>
              <th style="width: 150px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    // Filter recipes
    function filterRecipes() {
      renderTable();
    }

    // Start inline editing
    function startEdit(element, recipeId, field) {
      if (element.classList.contains('editing')) return;

      const recipe = allRecipes.find(r => r.id === recipeId);
      const currentValue = recipe[field];
      
      element.classList.add('editing');
      element.innerHTML = `<input type="text" value="${escapeHtml(currentValue)}" 
        onblur="finishEdit(this, '${recipeId}', '${field}')"
        onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${escapeHtml(currentValue)}';this.blur();}" />`;
      element.querySelector('input').focus();
      element.querySelector('input').select();
    }

    // Finish inline editing
    async function finishEdit(input, recipeId, field) {
      const newValue = input.value.trim();
      const recipe = allRecipes.find(r => r.id === recipeId);
      const oldValue = recipe[field];
      
      const parent = input.parentElement;
      parent.classList.remove('editing');

      if (newValue === oldValue || !newValue) {
        // Restore original value
        if (field === 'user_code') {
          parent.innerHTML = `<span class="user-badge">${escapeHtml(oldValue)}</span>`;
        } else {
          parent.innerHTML = `<span>${escapeHtml(oldValue)}</span>`;
        }
        return;
      }

      // Show loading state
      parent.innerHTML = `<span style="color: var(--text-muted);">Saving...</span>`;

      try {
        if (field === 'user_code') {
          // Transfer recipe to new user
          await transferRecipe(recipeId, newValue);
          recipe.user_code = newValue;
        } else if (field === 'name') {
          // Rename recipe
          await renameRecipe(recipeId, newValue);
          recipe.name = newValue;
        }
        
        showToast('Updated successfully!', 'success');
      } catch (error) {
        showToast('Failed to update: ' + error.message, 'error');
      }

      // Re-render
      renderTable();
    }

    // Transfer recipe to new user
    async function transferRecipe(recipeId, newUserCode) {
      const recipe = allRecipes.find(r => r.id === recipeId);
      
      // Update via API - we need to use the update endpoint
      const response = await fetch(`${API_URL}/api/recipes/${recipeId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: recipe.name,
          newUserCode: newUserCode.toLowerCase(),
          variations: recipe.variations || []
        })
      });

      if (!response.ok) throw new Error('Failed to transfer');
    }

    // Rename recipe
    async function renameRecipe(recipeId, newName) {
      const recipe = allRecipes.find(r => r.id === recipeId);
      
      const response = await fetch(`${API_URL}/api/recipes/${recipeId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: newName,
          variations: recipe.variations || []
        })
      });

      if (!response.ok) throw new Error('Failed to rename');
    }

    // View recipe (open in new tab)
    function viewRecipe(recipeId) {
      const recipe = allRecipes.find(r => r.id === recipeId);
      if (recipe) {
        // Try to generate share link first
        fetch(`${API_URL}/api/recipes/${recipeId}/share`, { method: 'POST' })
          .then(r => r.json())
          .then(data => {
            window.open(`${API_URL}/r/${data.shareId}`, '_blank');
          })
          .catch(() => {
            showToast('Could not generate share link', 'error');
          });
      }
    }

    // Delete modal
    function openDeleteModal(recipeId, recipeName) {
      deleteTargetId = recipeId;
      deleteTargetType = 'recipe';
      document.getElementById('deleteRecipeName').textContent = recipeName;
      document.querySelector('#deleteModal h2').textContent = '⚠️ Delete Recipe';
      document.querySelector('#deleteModal p').innerHTML = `Are you sure you want to delete "<span id="deleteRecipeName">${escapeHtml(recipeName)}</span>"? This cannot be undone.`;
      document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeDeleteModal() {
      deleteTargetId = null;
      document.getElementById('deleteModal').style.display = 'none';
    }

    async function confirmDelete() {
      if (!deleteTargetId) return;

      try {
        const response = await fetch(`${API_URL}/api/recipes/${deleteTargetId}`, {
          method: 'DELETE'
        });

        if (!response.ok) throw new Error('Failed to delete');

        allRecipes = allRecipes.filter(r => r.id !== deleteTargetId);
        document.getElementById('totalRecipes').textContent = allRecipes.length;
        
        showToast('Recipe deleted', 'success');
        renderTable();
      } catch (error) {
        showToast('Failed to delete: ' + error.message, 'error');
      }

      closeDeleteModal();
    }

    // Toast notification
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');
      
      toast.className = 'toast ' + type;
      toastMessage.textContent = message;
      toast.style.display = 'flex';

      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // === USER MANAGEMENT ===

    // Load all users
    async function loadUsers() {
      document.getElementById('usersContent').innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p>Loading users...</p>
        </div>
      `;

      try {
        const response = await fetch(`${API_URL}/api/admin/users`);
        if (!response.ok) throw new Error('Failed to fetch users');
        
        allUsers = await response.json();
        
        // Update stats
        document.getElementById('totalUsers').textContent = allUsers.length;

        renderUsersTable();
      } catch (e) {
        console.error('Failed to fetch users:', e);
        document.getElementById('usersContent').innerHTML = `
          <div class="empty-state">
            <p>Failed to load users: ${e.message}</p>
          </div>
        `;
      }
    }

    // Render users table
    function renderUsersTable() {
      if (allUsers.length === 0) {
        document.getElementById('usersContent').innerHTML = `
          <div class="empty-state">
            <p>No users found</p>
          </div>
        `;
        return;
      }

      const rows = allUsers.map(u => `
        <tr data-code="${u.code}">
          <td>
            <div class="editable" onclick="startEditUser(this, '${escapeHtml(u.code)}')">
              <span class="user-badge">${escapeHtml(u.code)}</span>
            </div>
          </td>
          <td>${u.recipeCount}</td>
          <td class="date">${new Date(u.createdAt).toLocaleDateString()}</td>
          <td>
            <div class="actions">
              <button class="btn-danger btn-small" onclick="openDeleteUserModal('${escapeHtml(u.code)}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      document.getElementById('usersContent').innerHTML = `
        <table>
          <thead>
            <tr>
              <th>User Code</th>
              <th style="width: 100px;">Recipes</th>
              <th style="width: 140px;">Created</th>
              <th style="width: 100px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      `;
    }

    // Add new user
    async function addUser() {
      const input = document.getElementById('newUserCode');
      const code = input.value.trim();
      
      if (!code) {
        showToast('Please enter a user code', 'error');
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/admin/users`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });

        if (response.status === 409) {
          showToast('User code already exists', 'error');
          return;
        }

        if (!response.ok) throw new Error('Failed to create user');

        const newUser = await response.json();
        allUsers.unshift(newUser);
        document.getElementById('totalUsers').textContent = allUsers.length;
        
        input.value = '';
        renderUsersTable();
        showToast('User created successfully!', 'success');
      } catch (error) {
        showToast('Failed to create user: ' + error.message, 'error');
      }
    }

    // Start editing user code inline
    function startEditUser(element, userCode) {
      if (element.classList.contains('editing')) return;

      element.classList.add('editing');
      element.innerHTML = `<input type="text" value="${escapeHtml(userCode)}" 
        onblur="finishEditUser(this, '${escapeHtml(userCode)}')"
        onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${escapeHtml(userCode)}';this.blur();}" />`;
      element.querySelector('input').focus();
      element.querySelector('input').select();
    }

    // Finish editing user code
    async function finishEditUser(input, oldCode) {
      const newCode = input.value.trim();
      const parent = input.parentElement;
      parent.classList.remove('editing');

      if (newCode === oldCode || !newCode) {
        // Restore original value
        parent.innerHTML = `<span class="user-badge">${escapeHtml(oldCode)}</span>`;
        return;
      }

      // Show loading state
      parent.innerHTML = `<span style="color: var(--text-muted);">Saving...</span>`;

      try {
        const response = await fetch(`${API_URL}/api/admin/users/${encodeURIComponent(oldCode)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newCode })
        });

        if (response.status === 409) {
          showToast('User code already exists', 'error');
          parent.innerHTML = `<span class="user-badge">${escapeHtml(oldCode)}</span>`;
          return;
        }

        if (!response.ok) throw new Error('Failed to rename user');

        // Update local data
        const user = allUsers.find(u => u.code === oldCode);
        if (user) user.code = newCode.toLowerCase();

        showToast('User renamed successfully!', 'success');
        renderUsersTable();
      } catch (error) {
        showToast('Failed to rename: ' + error.message, 'error');
        parent.innerHTML = `<span class="user-badge">${escapeHtml(oldCode)}</span>`;
      }
    }

    // Delete user modal
    function openDeleteUserModal(userCode) {
      deleteTargetId = userCode;
      deleteTargetType = 'user';
      document.getElementById('deleteRecipeName').textContent = userCode;
      document.querySelector('#deleteModal h2').textContent = '⚠️ Delete User';
      document.querySelector('#deleteModal p').innerHTML = `Are you sure you want to delete user "<span id="deleteRecipeName">${escapeHtml(userCode)}</span>"? They won't be able to log in anymore.`;
      document.getElementById('deleteModal').style.display = 'flex';
    }

    // Delete user
    async function deleteUser(userCode) {
      try {
        const response = await fetch(`${API_URL}/api/admin/users/${encodeURIComponent(userCode)}`, {
          method: 'DELETE'
        });

        if (!response.ok) throw new Error('Failed to delete user');

        allUsers = allUsers.filter(u => u.code !== userCode);
        document.getElementById('totalUsers').textContent = allUsers.length;
        
        showToast('User deleted', 'success');
        renderUsersTable();
      } catch (error) {
        showToast('Failed to delete user: ' + error.message, 'error');
      }
    }

    // Update confirmDelete to handle both types
    const originalConfirmDelete = confirmDelete;
    confirmDelete = async function() {
      if (!deleteTargetId) return;

      if (deleteTargetType === 'user') {
        await deleteUser(deleteTargetId);
        closeDeleteModal();
        // Reset modal text
        document.querySelector('#deleteModal h2').textContent = '⚠️ Delete Recipe';
        deleteTargetType = null;
      } else {
        await originalConfirmDelete();
      }
    };

    // Auto-fill API URL if on localhost
    window.onload = function() {
      // Default to Render URL
      document.getElementById('apiUrl').value = 'https://cheffinator.onrender.com';
    };
  </script>
</body>
</html>
